name: Build Jarvis APK

# Run this manually from the "Actions" tab on GitHub ("Run workflow"
# button), or automatically any time you push a change.
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build APK using Kivy's official Buildozer Docker image
        # Runs buildozer inside Kivy's own maintained Docker image
        # (kivy/buildozer on Docker Hub) instead of a third-party
        # wrapper action - the wrapper's own setup script was pulling
        # in a Java package repository that no longer has files for
        # the Ubuntu version it runs on, causing the earlier failure.
        # This image is self-contained and doesn't have that problem.
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/home/user/hostcwd \
            kivy/buildozer android debug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
